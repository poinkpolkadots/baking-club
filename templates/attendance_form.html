{% extends "base.html" %}
{% block title %}Attendance{% endblock %}
{% block content %}
<form method="POST">
    <fieldset>
        <legend>What date was the meeting?</legend>
        <input type="date" name="meeting-date" id="meeting-date" required>
    </fieldset>
    <br>
    <fieldset>
        <legend>Did you bring anything?</legend>
            <input type="radio" name="brought-baked-good" value="true" required>
            <label>Yes</label>
            <input type="radio" name="brought-baked-good" value="false">
            <label>No</label>
    </fieldset>
    <div id="baked-good-section" hidden>
        <br>
        <fieldset>
            <legend>What did you bring?</legend>
            <input type="text" name="baked-good" id="baked-good" disabled>
        </fieldset>        
    </div>
    <br>
    <button type="submit">Submit Attendance</button>
</form>
{% endblock %}
